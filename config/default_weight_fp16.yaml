### DPVO Config File ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 96
REMOVAL_WINDOW: 22
OPTIMIZATION_WINDOW: 10
PATCH_LIFETIME: 13
BA_ITERATIONS: 2

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# run neural-network ops under autocast and store NN state/cache tensors in FP16
MIXED_PRECISION: True
# additionally store neural-network weights in FP16; BA state remains FP32
NN_FP16_WEIGHTS: True

CENTROID_SEL_STRAT: 'RANDOM'
