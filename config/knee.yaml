### DPVO Config File ###

# VO config (increase for better accuracy)
PATCHES_PER_FRAME: 32
REMOVAL_WINDOW: 14
OPTIMIZATION_WINDOW: 6 
PATCH_LIFETIME: 7
BA_ITERATIONS: 2

# threshold for keyframe removal
KEYFRAME_THRESH: 15.0

# camera motion model
MOTION_MODEL: 'DAMPED_LINEAR'
MOTION_DAMPING: 0.5

# maybe use mixed precision for inference
MIXED_PRECISION: True
# store neural-network weights in FP16; BA state remains FP32 in dpvo.py
NN_FP16_WEIGHTS: False

CENTROID_SEL_STRAT: 'RANDOM'
